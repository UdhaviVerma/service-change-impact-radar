services:
  - type: web
    name: service-change-impact-radar-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: https://service-change-impact-radar-frontend.onrender.com

  - type: web
    name: service-change-impact-radar-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_API_BASE_URL
        value: https://service-change-impact-radar-backend.onrender.com
